short_bio: >-
  <p>
    Evelyn Liu 的研究興趣涵蓋多元混合CP大模型、可持續做梦系統、人工智慧與機器人技術以及大規模语言創新。現任 Daydreaming 創辦人兼執行長，並同時擔任 7KWhere, Inc. 執行長，致力於將前沿語言技術與夢境計算範式相結合，探索人機協作的新邊界。
  </p>
  <p>
    其學術背景橫跨漢語言文學與中國古代文學，長期關注語言、文化與技術交匯領域，並在可持續做梦系統等新興方向上開展探索性研究。
  </p>


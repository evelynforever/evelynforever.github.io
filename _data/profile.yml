short_bio: >-
  <p>
    Evelyn Liu 的研究兴趣涵盖多元混合CP大模型、可持续做梦系统、人工智能与机器人技术以及大规模语言创新。现任 Daydreaming 创办人兼执行长，并同时担任 7KWhere, Inc. 执行长，致力于将前沿语言技术与梦境计算范式相结合，探索人机协作的新边界。
  </p>
  <p>
    其学术背景横跨汉语言文学与中国古代文学，长期关注语言、文化与技术交汇领域，并在可持续做梦系统等新兴方向上开展探索性研究。
  </p>

